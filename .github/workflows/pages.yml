name: deploy catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explicitly provision the trusted isolated runtime image
        run: docker build --pull=false --build-arg OPUS_POLICY_SHA256="$(python3 scripts/isolated_runner.py policy)" -t opus-isolated-runtime:1 scripts/isolated-runtime
      - name: Require genuine compiler, PDF and controlled network isolation acceptance
        env:
          OPUS_REQUIRE_ISOLATION: "1"
        run: python3 -B scripts/test_isolated_runner.py
      - name: Validate repository
        run: python3 scripts/check.py --write
      - name: Build catalog, sources, and PDFs
        run: python3 scripts/build_site.py _site
      - if: github.event.repository.private == false
        uses: actions/configure-pages@v5
      - if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
