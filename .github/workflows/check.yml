name: check

on:
  pull_request:

jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install LilyPond for the two hardcoded synthetic browser fixtures only
        run: sudo apt-get update && sudo apt-get install --yes lilypond
      - name: Explicitly provision the trusted isolated runtime image
        run: docker build --pull=false --build-arg OPUS_POLICY_SHA256="$(python3 scripts/isolated_runner.py policy)" -t opus-isolated-runtime:1 scripts/isolated-runtime
      - name: Require genuine compiler and PDF isolation acceptance
        env:
          OPUS_REQUIRE_ISOLATION: "1"
        run: python3 -B scripts/test_isolated_runner.py
      - name: Validate catalog and scores
        run: python3 scripts/check.py
      - name: Test pull-request checker
        run: python3 -B scripts/test_check_pr.py
      - name: Test contributor site packaging
        run: python3 -B scripts/test_build_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check browser modules and contributor links
        run: |
          node contributor/score/qa/check-integration.cjs
          node contributor/tests/work-links.test.mjs
          node contributor/score/qa/github-handoff.test.mjs
          node contributor/score/qa/shared-packages.test.mjs
          node contributor/score/qa/shared-client.test.mjs
          node contributor/score/qa/shared-ui.test.mjs
          node contributor/score/qa/instruction-boundary.test.mjs
      - name: Test restricted agent broker boundaries without model inference
        run: python3 -B scripts/test_restricted_agent.py
      - name: Test durable shared service
        run: python3 -B -m unittest discover -s service -p 'test_*.py' -v
      - name: Install isolated browser test tools
        run: |
          npm install --prefix .build/browser-tools --no-save playwright@1.62.1
          node .build/browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise local and cross-person browser workflows
        env:
          OPUS_PLAYWRIGHT: .build/browser-tools/node_modules/playwright/index.mjs
          OPUS_PYTHON: python3
        run: node scripts/browser-tests.mjs --shared
      - name: Validate transcription provenance
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr.py
